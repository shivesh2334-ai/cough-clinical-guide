<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Cough – Harrison Ch.38</title>
<style>
:root{--bg:#faf6f0;--card:#fff;--tx:#1f2430;--mu:#6b6f7b;--ac:#b9763f;--ac2:#8e6fa3;--bd:#e7dccd;--ok:#2e7d5b;--bad:#b3392f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181d;--card:#22242b;--tx:#ecebe8;--mu:#a2a5af;--bd:#34363f;--ac:#d9955a;--ac2:#b79ccb;--ok:#58c08f;--bad:#ef7d72}}
:root[data-theme="dark"]{--bg:#17181d;--card:#22242b;--tx:#ecebe8;--mu:#a2a5af;--bd:#34363f;--ac:#d9955a;--ac2:#b79ccb;--ok:#58c08f;--bad:#ef7d72}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--ac);color:#fff;padding:14px 16px}header h1{margin:0;font:700 22px Georgia,serif}header p{margin:2px 0 0;font-size:12px;opacity:.9}
nav{display:flex;overflow-x:auto;gap:6px;padding:8px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:none;color:var(--tx);padding:7px 12px;border-radius:18px;font-size:13px}nav button.on{background:var(--ac2);color:#fff;border-color:var(--ac2)}
main{max-width:760px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
h2{font:700 17px Georgia,serif;color:var(--ac2);margin:0 0 6px}h3{font-size:14px;margin:8px 0 4px}.mu{color:var(--mu);font-size:13px}
label.ck{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:16px;padding:5px 10px;margin:3px 3px 0 0;font-size:13px}
select,input[type=text]{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bd);margin-right:4px}.red{color:var(--bad);font-weight:600}
button.p{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;margin:4px 4px 0 0}
.bar{height:6px;background:var(--bd);border-radius:3px}.bar i{display:block;height:6px;background:var(--ac);border-radius:3px}
ul{padding-left:18px;margin:4px 0}.opt{display:block;width:100%;text-align:left;margin:4px 0;padding:9px;border:1px solid var(--bd);border-radius:8px;background:none;color:var(--tx);font-size:14px}.opt.r{border-color:var(--ok);background:rgba(46,125,91,.15)}.opt.w{border-color:var(--bad);background:rgba(179,57,47,.15)}
.fc{min-height:110px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;cursor:pointer}
.warn{font-size:12px;color:var(--mu);padding:8px 12px 24px}
</style></head><body>
<header><h1>Cough</h1><p>Based on Harrison’s Principles of Internal Medicine, Ch. 38 (Fanta) + ERS 2020 / CHEST guidance</p></header>
<nav id="nav"></nav><main id="m"></main>
<div class="warn">Educational tool for clinicians and trainees. Not a substitute for clinical judgement. Doses/agents: verify against current local guidelines and labels.</div>
<script>
const $=s=>document.querySelector(s);
const C=[
{n:"Upper airway cough syndrome (postnasal drip)",t:["chronic","subacute"],f:["throatclear","rhinorrhea","sneeze","cobble"],cxr:"normal",dx:"Clinical; nasal exam (cobblestone mucosa, secretions, polyps). No way to quantify drip.",rx:"Saline irrigation, nasal glucocorticoid or antihistamine sprays, systemic antihistamine/decongestant, antibiotics if infective sinusitis."},
{n:"Cough-variant asthma",t:["chronic","subacute"],f:["dry","wheeze","exercise","allergen","night"],cxr:"normal",dx:"Spirometry with reversibility, variable peak flow, methacholine challenge (negative effectively excludes).",rx:"Inhaled glucocorticoid ± intermittent β-agonist; ERS: short antileukotriene trial (2–4 wk)."},
{n:"Eosinophilic bronchitis",t:["chronic"],f:["dry","sputumeos"],cxr:"normal",dx:"Sputum eosinophils >3% without airflow obstruction or bronchial hyperresponsiveness; exhaled NO raised.",rx:"Inhaled glucocorticoids (good response)."},
{n:"Gastroesophageal reflux",t:["chronic"],f:["heartburn","hoarse","meals","recumbent"],cxr:"normal",dx:"Often silent; pH/impedance monitoring is imperfect. Heartburn, regurgitation, hoarseness suggest it. Many with reflux do not cough.",rx:"PPI/H2 blocker, antacids, diet, head/torso elevation, alginates, prokinetics. (ERS suggests against routine antacid use without GI symptoms.)"},
{n:"ACE inhibitor–induced cough",t:["chronic","subacute"],f:["ace","dry"],cxr:"normal",dx:"5–30% of patients; not dose-dependent; bradykinin/substance P. Stop drug for ≥1 month.",rx:"Stop ACE inhibitor; switch to ARB (does not cause cough). No improvement after 1 month argues against it."},
{n:"Cough hypersensitivity syndrome (unexplained)",t:["chronic"],f:["dry","tickle","talk","women"],cxr:"normal",dx:"Diagnosis of exclusion after testing/therapeutic trials; throat tickle, triggered by talking, laughing, exertion.",rx:"Gabapentin/pregabalin/amitriptyline (off-label), speech therapy, low-dose morphine (ERS); gefapixant (P2X3) where approved."},
{n:"Chronic bronchitis / COPD",t:["chronic"],f:["smoker","morningsputum","sputum"],cxr:"normal",dx:"Spirometry (post-bronchodilator obstruction), smoking history.",rx:"Smoking cessation, bronchodilators, ICS/LABA if fixed obstruction (ERS: 2–4 wk trial)."},
{n:"Post-viral / postbronchitic cough",t:["subacute","chronic"],f:["recentuti","dry"],cxr:"normal",dx:"Dry cough lingering weeks after URI (pertussis consider); tracheobronchitis residuum.",rx:"Reassurance, time; consider inhaled therapy trial; test for pertussis in outbreaks."},
{n:"Acute respiratory infection / irritant exposure",t:["acute"],f:["fever","sputum","dry","smoke"],cxr:"any",dx:"Most common cause of cough <3 weeks; also aspiration or noxious chemicals/smoke.",rx:"Supportive; treat specific pathogen if bacterial pneumonia; avoid exposure."},
{n:"Lung cancer / sarcoidosis / Hodgkin / ILD / bronchiectasis",t:["chronic"],f:["hemoptysis","weightloss","clubbing","crackles"],cxr:"abnormal",dx:"Chest radiograph then CT; sputum cytology, bronchoscopy as indicated.",rx:"Disease-directed."},
{n:"Tuberculosis / atypical mycobacteria",t:["chronic","subacute"],f:["fever","weightloss","hemoptysis","sputum"],cxr:"abnormal",dx:"Sputum AFB/NAAT, culture, chest imaging. Always consider in endemic regions.",rx:"Standard anti-tubercular regimen per national program."},
{n:"Impaired cough (weak, ineffective)",t:["chronic","subacute","acute"],f:["weak","pain","neuro"],cxr:"any",dx:"Peak expiratory flow / maximal expiratory pressure; look for muscle weakness, chest-wall deformity, tracheostomy, tracheomalacia, ciliary dysfunction, CF.",rx:"Splint abdomen with pillow, mechanical cough-assist (insufflation-exsufflation), airway clearance, treat cause."}];
const F={dry:"Dry / minimal sputum",sputum:"Productive cough",morningsputum:"Early-morning productive cough",throatclear:"Frequent throat clearing / drip sensation",rhinorrhea:"Rhinorrhea / nasal congestion",sneeze:"Sneezing",cobble:"Cobblestone pharynx / nasal secretions",wheeze:"Wheeze / chest tightness",exercise:"Worse with exercise / cold air",allergen:"Triggered by allergen exposure",night:"Worse lying down / at night",heartburn:"Heartburn / regurgitation",hoarse:"Hoarseness / throat pain",meals:"Belching, worse after meals",recumbent:"Worse recumbent",ace:"On ACE inhibitor",tickle:"Throat tickle / hypersensitivity",talk:"Triggered by talking, laughing",smoker:"Long-time smoker",recentuti:"Recent URI (<2 mo)",fever:"Fever",hemoptysis:"Hemoptysis",weightloss:"Weight loss / night sweats",clubbing:"Clubbing",crackles:"Crackles on exam",weak:"Weak cough / neuromuscular",pain:"Chest wall / abdominal pain",neuro:"Sedation / neurologic disease",smoke:"Smoke / chemical exposure",sputumeos:"Eosinophils in sputum",women:"Female, long-standing"};
const RF=["hemoptysis","weightloss","clubbing","crackles","fever"];
const T=[
["Tab","Cough duration","Acute <3 wk (infection, aspiration, smoke/chemicals). Subacute 3–8 wk (post-infectious). Chronic >8 wk (adults; ERS: ≥4 wk in children)."]];
const learn={
path:[["Triggers","Chemical (capsaicin) and mechanical (mucus, particulates) stimuli start the reflex. TRP channels and ATP-gated P2X3 channels are sensory receptors."],["Afferents","Aδ (mechanosensory) and C fibres (chemosensory) from pharynx, larynx, airways to terminal bronchioles, lung parenchyma, external auditory canal (Arnold’s nerve) and esophagus."],["Central","Via vagus and superior laryngeal nerves to nucleus tractus solitarius; processed into the ‘urge to cough’. Cortical input allows voluntary cough."],["Efferent","Deep inspiration, glottic closure (vocal cords adduct), expiratory muscle contraction (intrathoracic pressure up to ~300 mmHg), sudden glottic opening → expiratory flow exceeding the normal flow-volume envelope."],["Clearance","Bronchial smooth-muscle contraction and dynamic compression narrow airways, maximizing velocity. Kinetic energy ∝ velocity². Repeated coughs sweep the point of maximal flow to lower lung volumes."],["Impaired cough","Weak expiratory/chest wall muscles, pain, deformity, impaired glottic closure, central depression, abnormal secretions (CF), ciliary dysfunction, tracheobronchomalacia, bronchiectasis, stenoses → retained secretions, infection, atelectasis."],["Complications","Emesis, syncope, muscle pain, rib fractures, worsened hernias, urinary incontinence, low back pain, social impairment."],["Hypersensitivity","Sensitized sensory nerves / reflex pathways cause chronic refractory cough with a throat tickle; more common in women; may be self-perpetuating."]],
q:[["Which fibres carry chemosensory cough signals?",["Aδ","C fibres","Aβ","Ia"],1],["Where do cough afferents synapse centrally?",["Nucleus ambiguus","Nucleus tractus solitarius","Locus coeruleus","Red nucleus"],1],["Chronic cough in adults lasts longer than:",["3 weeks","4 weeks","8 weeks","12 weeks"],2],["Next step for chronic cough on an ACE inhibitor?",["Add antihistamine","Stop ACEi for ≥1 month","Dose reduce","Chest CT"],1],["Cough-variant asthma is most common in:",["Adults","Children","Elderly only","Smokers"],1],["Eosinophilic bronchitis is defined by sputum eosinophils above:",["1%","3%","10%","25%"],1],["Most potent cough suppressants act at:",["Cough center in brainstem","Airway nerve endings","Vagal efferents","Alveoli"],0],["Experimental P2X3 antagonist named in the chapter:",["Gabapentin","Gefapixant","Benzonatate","Lidocaine"],1],["Hemoptysis with cough warrants:",["Dextromethorphan","Special assessment (Chap. 39)","Empiric PPI","Reassurance"],1],["Dry cough lingering >2 months after infection is called:",["Postbronchitic cough","Cough-variant asthma","UACS","GERD cough"],0]],
fc:[["Acute cough","<3 weeks: most often respiratory infection, aspiration, or inhaled irritants."],["Subacute cough","3–8 weeks: residuum of tracheobronchitis, pertussis, postviral."],["Chronic cough","Over 8 weeks. Think ACEi, UACS, asthma/EB, GERD, hypersensitivity."],["Benzonatate","Inhibits sensory nerves; generally free of side effects; variable effect."],["Dextromethorphan","OTC central suppressant, fewer side effects, less efficacy than narcotics; can combine with them."],["Inhaled lidocaine","Transient suppression but risk of aspiration (oropharyngeal anesthesia)."],["Cough hypersensitivity: drugs","Gabapentin, pregabalin, amitriptyline (off-label); speech therapy."],["Chest CT?","Only if CXR abnormal or refractory/no diagnosis (ERS: not routine when CXR and exam normal)."]]};
const G=[["ERS 2020 (Morice, Eur Respir J 55:1901136)","Chronic cough = ≥8 wk adults, ≥4 wk children. Adults: cough hypersensitivity is the overarching concept. Do not routinely do chest CT if CXR and exam normal. Short (2–4 wk) antileukotriene trial, esp. asthmatic cough. 2–4 wk ICS + LABA trial if fixed airflow obstruction. Suggest against routine antacids in the absence of GI symptoms. Cough control therapy (speech/physiotherapy). Low-dose slow-release morphine (5–10 mg bd) for refractory cough; gabapentin or pregabalin trial. Children: wet cough with normal CXR/spirometry → antibiotic trial (protracted bacterial bronchitis)."],["CHEST 2016 (Gibson)","Unexplained chronic cough: trial of gabapentin or pregabalin and speech pathology (cough suppression) therapy; morphine for refractory cases per expert panel."],["Gefapixant (P2X3 antagonist)","Studied in refractory or unexplained chronic cough in adults (COUGH-1/2 trials); taste disturbance a frequent adverse effect. Availability and approval vary by country: check local regulator."],["Always","Chest radiograph for persistent cough; consider TB in endemic regions; hemoptysis needs dedicated work-up."]];
const tabs={assess:"Assess",path:"Pathophysiology",dx:"Work-up",rx:"Treatment",learn:"Learn",guide:"Guidelines",search:"Search"};
let cur="assess",sel=new Set(),dur="chronic",cxr="normal";
function nav(){$("#nav").innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k==cur?"on":""}" onclick="go('${k}')">${v}</button>`).join("")}
function go(k){cur=k;nav();R[k]();scrollTo(0,0)}
const R={
assess(){const fk=Object.keys(F);$("#m").innerHTML=`<div class="card"><h2>Cough assessment</h2><h3>Duration</h3><select onchange="dur=this.value"><option value="acute" ${dur=="acute"?"selected":""}>Acute (&lt;3 wk)</option><option value="subacute" ${dur=="subacute"?"selected":""}>Subacute (3–8 wk)</option><option value="chronic" ${dur=="chronic"?"selected":""}>Chronic (&gt;8 wk)</option></select><h3>Chest radiograph</h3><select onchange="cxr=this.value"><option value="normal">Normal</option><option value="abnormal" ${cxr=="abnormal"?"selected":""}>Abnormal</option></select><h3>Features</h3>${fk.map(k=>`<label class="ck"><input type="checkbox" ${sel.has(k)?"checked":""} onchange="this.checked?sel.add('${k}'):sel.delete('${k}')">${F[k]}</label>`).join("")}<br><button class="p" onclick="calc()">Suggest causes</button><button class="p" style="background:var(--mu)" onclick="sel.clear();go('assess')">Reset</button></div><div id="out"></div>`},
path(){$("#m").innerHTML=learn.path.map(([a,b])=>`<div class="card"><h2>${a}</h2>${b}</div>`).join("")+`<div class="card"><h2>Flow-volume curve</h2>Coughs appear as spikes of high expiratory flow that exceed the predicted envelope (Fig. 38-1).</div>`},
dx(){$("#m").innerHTML=`<div class="card"><h2>Assessment of chronic cough</h2><ul><li>History: timing, resonance, pattern (paroxysms), worse lying/talking/exercise, allergen/cold-air triggers, onset circumstances, sputum, meds (ACEi).</li><li>Exam: wheeze, crackles; ears/tympanic membranes (Arnold’s nerve), nose (rhinitis, polyps), clubbing, systemic disease (sarcoid, vasculitis).</li><li>Chest radiograph in virtually all chronic cough.</li><li>Purulent sputum → bacterial ± mycobacterial culture; cytology for malignancy, aspiration, eosinophils.</li><li>Blood/streaks/pure blood → special approach (Chap. 39).</li></ul></div><div class="card"><h2>Normal CXR: usual culprits</h2>ACEi, postnasal drip, asthma, GERD (reportedly &gt;90% historically; clinical experience says this is overstated). Also eosinophilic bronchitis, cough hypersensitivity.<ul><li>Spirometry/reversibility, peak flow, methacholine challenge.</li><li>Exhaled NO for eosinophilic airway inflammation.</li><li>pH/impedance monitoring only if needed; interpretation debated.</li><li>CT chest if no response to treatment or no cause found.</li></ul></div><div class="card"><h2>Table 38-1: impaired cough</h2>Respiratory muscle weakness · chest wall/abdominal pain · chest wall deformity · impaired glottic closure/tracheostomy · central respiratory depression · abnormal secretions · ciliary dysfunction · tracheobronchomalacia · bronchiectasis · tracheal/bronchial stenoses.</div>`},
rx(){$("#m").innerHTML=C.map(c=>`<div class="card"><h2>${c.n}</h2><b>Treat:</b> ${c.rx}</div>`).join("")+`<div class="card"><h2>Symptom-based treatment</h2><ul><li>Narcotic suppressants (codeine, hydrocodone, morphine): most potent, act at cough center; drowsiness, constipation, dependence limit use.</li><li>Dextromethorphan: OTC, fewer effects, less efficacy.</li><li>Benzonatate: variable, generally well tolerated.</li><li>Inhaled lidocaine: transient; aspiration risk.</li><li>Hypersensitivity: gabapentin, pregabalin, amitriptyline; speech therapy.</li><li>Emerging: NK-1, TRPV1 antagonists, P2X3 antagonist gefapixant, novel opioid-like agonists.</li></ul></div><div class="card"><h2>Global considerations</h2>Air pollution, indoor cooking/heating smoke, occupational exposures → improve air quality, stove chimney, mask. In TB-endemic areas always consider active TB (chest imaging, sputum).</div>`},
learn(){$("#m").innerHTML=`<div class="card"><h2>Quiz</h2><div id="qz"></div></div><div class="card"><h2>Flashcards</h2><div class="card fc" id="fc" onclick="flip()"></div><button class="p" onclick="fi=(fi+1)%learn.fc.length;sh=0;flip(1)">Next</button></div>`;qi=0;score=0;quiz();fi=0;sh=0;flip(1)},
guide(){$("#m").innerHTML=G.map(([a,b])=>`<div class="card"><h2>${a}</h2>${b}</div>`).join("")+`<div class="card mu">Sources: ERS guideline (Eur Respir J 2020;55:1901136), CHEST Expert Cough Panel (Chest 2016;149:27), FDA gefapixant briefing (NDA 215010), Harrison’s Ch. 38.</div>`},
search(){$("#m").innerHTML=`<div class="card"><input type="text" id="sq" placeholder="Search cause, feature, drug…" oninput="srch()"></div><div id="sr"></div>`;srch()}};
function calc(){const sc=C.map(c=>{if(!c.t.includes(dur))return{c,s:-1};let s=c.f.filter(f=>sel.has(f)).length*2;if(c.cxr!="any"&&c.cxr==cxr)s+=1;else if(c.cxr!="any")s-=2;return{c,s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,6);const rf=RF.filter(f=>sel.has(f));const mx=sc[0]?sc[0].s:1;
$("#out").innerHTML=(rf.length?`<div class="card red">Red flags: ${rf.map(f=>F[f]).join(", ")}. Image the chest, sputum studies; consider TB/malignancy.</div>`:"")+(cxr=="abnormal"?`<div class="card">Abnormal radiograph: work-up should explain the abnormality (CT, sputum, bronchoscopy).</div>`:"")+(sc.length?sc.map(x=>`<div class="card"><h2>${x.c.n}</h2><div class="bar"><i style="width:${x.s/mx*100}%"></i></div><p><b>Diagnosis:</b> ${x.c.dx}</p><p><b>Treatment:</b> ${x.c.rx}</p></div>`).join(""):`<div class="card mu">No match. Select more features.</div>`)}
function srch(){const q=$("#sq").value.toLowerCase();const r=C.filter(c=>!q||(c.n+c.dx+c.rx+c.f.map(f=>F[f]).join()).toLowerCase().includes(q));$("#sr").innerHTML=r.map(c=>`<div class="card"><h2>${c.n}</h2>${c.t.map(t=>`<span class="tag">${t}</span>`).join("")}<p><b>Features:</b> ${c.f.map(f=>F[f]).join("; ")}</p><p><b>Dx:</b> ${c.dx}</p><p><b>Rx:</b> ${c.rx}</p></div>`).join("")||'<div class="card mu">No results</div>'}
let qi,score,fi,sh;
function quiz(){const z=$("#qz");if(qi>=learn.q.length){z.innerHTML=`<b>Score: ${score}/${learn.q.length}</b><br><button class="p" onclick="qi=0;score=0;quiz()">Retry</button>`;return}const[q,o]=learn.q[qi];z.innerHTML=`<p class="mu">Question ${qi+1}/${learn.q.length}</p><p><b>${q}</b></p>`+o.map((x,i)=>`<button class="opt" onclick="ans(${i},this)">${x}</button>`).join("")}
function ans(i,b){const a=learn.q[qi][2];document.querySelectorAll(".opt").forEach((e,j)=>{e.disabled=true;if(j==a)e.classList.add("r")});if(i==a)score++;else b.classList.add("w");setTimeout(()=>{qi++;quiz()},900)}
function flip(r){if(!r)sh=!sh;const c=learn.fc[fi];$("#fc").innerHTML=sh?c[1]:`<b>${c[0]}</b>`}
nav();R.assess();
</script></body></html>
